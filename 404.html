<title>Page introuvable · Escale</title>

@font-face{font-family:Archivo;font-weight:500 900;font-stretch:100% 125%;font-display:swap;src:url(/Escale/fonts/archivo-l.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:400 800;font-display:swap;src:url(/Escale/fonts/manrope-l.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1030;color:#e9ecff;font-family:Manrope,system-ui,sans-serif;padding:24px}
main{max-width:460px;text-align:left}
.code{font-family:Archivo,sans-serif;font-weight:900;font-stretch:125%;font-size:72px;letter-spacing:-.04em;line-height:1;color:#ff2f7a;margin:0 0 8px}

p{color:#a9b2d8;line-height:1.55;margin:0 0 24px}
a{display:inline-block;background:#fff;color:#0b1030;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:999px}
a:focus-visible{outline:3px solid #ff2f7a;outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>Ce vol n'existe pas</h1>
<p>La page que tu cherches a changé d'adresse ou n'a jamais existé. Les 74 villes t'attendent sur l'accueil.</p>

name: Télécharger les logos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python tools/fetch_logos.py
      # Les PNG obtenus servent de source : le site utilise les paquets compressés de logos/*.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet || git commit -m "Logos des universités hébergés sur le site"
          git push
